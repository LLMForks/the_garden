[package]
name = "the_garden"
version = "0.1.0-beta"
edition = "2021"
description = "The Garden — cozy co-op farming on a shared island (beta)"
license = "MIT"

[dependencies]
bevy = { version = "0.16", default-features = true, features = ["wayland", "wav"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rand = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
